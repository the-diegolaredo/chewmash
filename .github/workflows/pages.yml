name: Deploy web beta

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Install dependencies
        run: npm install

      - name: Build connector package
        run: |
          npm run build
          npm run zip

      - name: Build web app
        run: npm run build:web

      - name: Bundle connector download with website
        run: |
          mkdir -p apps/web/dist/downloads
          connector_zip="$(find .output -maxdepth 1 -type f -name '*chrome*.zip' -print -quit)"
          if [ -z "$connector_zip" ]; then
            echo "Could not find the built Chrome connector ZIP in .output" >&2
            exit 1
          fi
          cp "$connector_zip" apps/web/dist/downloads/chewmash-connector-beta.zip

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
