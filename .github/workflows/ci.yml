name: CI

on:
  pull_request:
  push:
    branches:
      - react-wxt-migration

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Run domain tests
        run: npm test

      - name: Build extension
        run: npm run build
