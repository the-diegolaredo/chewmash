name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

      - name: Build extension
        run: npm run build

      - name: Verify generated manifest
        run: npm run check:manifest

      - name: Build Chrome Web Store ZIP
        run: npm run zip

      - name: Upload unpacked Chrome beta
        uses: actions/upload-artifact@v4
        with:
          name: chewmash-chrome-beta
          path: .output/chrome-mv3/
          if-no-files-found: error
          retention-days: 14

      - name: Upload Chrome Web Store package
        uses: actions/upload-artifact@v4
        with:
          name: chewmash-chrome-store-zip
          path: .output/*.zip
          if-no-files-found: error
          retention-days: 30
