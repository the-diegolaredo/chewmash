name: Picks hours API probe

on:
  push:
    branches:
      - picks-catalog-hours-validation

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Verify Dine On Campus API from real Chrome on chewmash.app
        shell: bash
        run: |
          set -euo pipefail
          chrome="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          if [ -z "$chrome" ]; then
            echo 'No Chrome/Chromium binary on runner.'
            exit 1
          fi
          echo "Using ${chrome}"
          "$chrome" \
            --headless=new \
            --no-sandbox \
            --disable-dev-shm-usage \
            --remote-debugging-port=9222 \
            --user-data-dir=/tmp/picks-chrome \
            'https://chewmash.app' >/tmp/chrome.log 2>&1 &
          chrome_pid=$!
          trap 'kill ${chrome_pid} 2>/dev/null || true' EXIT

          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:9222/json >/tmp/tabs.json 2>/dev/null; then break; fi
            sleep 1
          done
          sleep 4

          node - <<'NODE'
          const tabs = await fetch('http://127.0.0.1:9222/json').then(r => r.json());
          const tab = tabs.find(t => String(t.url).startsWith('https://chewmash.app')) ?? tabs[0];
          if (!tab?.webSocketDebuggerUrl) throw new Error('Could not find ChewMash Chrome tab');
          const ws = new WebSocket(tab.webSocketDebuggerUrl);
          let nextId = 1;
          const pending = new Map();
          ws.onmessage = event => {
            const msg = JSON.parse(event.data);
            if (!msg.id) return;
            const entry = pending.get(msg.id);
            if (entry) { pending.delete(msg.id); entry(msg); }
          };
          await new Promise((resolve, reject) => {
            ws.onopen = resolve;
            ws.onerror = reject;
          });
          const call = (method, params = {}) => new Promise((resolve, reject) => {
            const id = nextId++;
            pending.set(id, msg => msg.error ? reject(new Error(JSON.stringify(msg.error))) : resolve(msg.result));
            ws.send(JSON.stringify({id, method, params}));
          });
          await call('Runtime.enable');
          const expression = `(async () => {
            const result = { pageUrl: location.href, userAgent: navigator.userAgent };
            try {
              const response = await fetch('https://apiv4.dineoncampus.com/sites/public', {
                method: 'GET',
                headers: { Accept: 'application/json, text/plain, */*' },
                cache: 'no-store'
              });
              const text = await response.text();
              return {
                ...result,
                fetchSucceeded: true,
                status: response.status,
                ok: response.ok,
                type: response.type,
                contentType: response.headers.get('content-type'),
                corsHeader: response.headers.get('access-control-allow-origin'),
                preview: text.slice(0, 180)
              };
            } catch (error) {
              return {
                ...result,
                fetchSucceeded: false,
                errorName: error?.name ?? null,
                error: String(error)
              };
            }
          })()`;
          const result = await call('Runtime.evaluate', {
            expression,
            awaitPromise: true,
            returnByValue: true,
          });
          console.log('BROWSER_PROBE=' + JSON.stringify(result?.result?.value ?? result, null, 2));
          ws.close();
          NODE

          echo '--- direct network check ---'
          code=$(curl -sS -o /tmp/api-body -D /tmp/api-headers -w '%{http_code}' \
            -H 'Origin: https://chewmash.app' \
            -H 'Accept: application/json, text/plain, */*' \
            'https://apiv4.dineoncampus.com/sites/public' || true)
          echo "HTTP ${code}"
          grep -Ei '^(cf-mitigated|access-control-allow-origin|content-type|server):' /tmp/api-headers || true
          head -c 100 /tmp/api-body || true
          echo
