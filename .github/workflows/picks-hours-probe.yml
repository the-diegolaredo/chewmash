name: Picks hours API probe

on:
  push:
    branches:
      - picks-catalog-hours-validation

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe Dine On Campus public APIs with browser-like CORS origin
        shell: bash
        run: |
          set -euo pipefail
          origin='https://chewmash.app'
          echo '--- sites/public ---'
          curl -sS -D sites.headers -o sites.json \
            -H "Origin: ${origin}" \
            -H 'Accept: application/json, text/plain, */*' \
            -H 'Sec-Fetch-Mode: cors' \
            'https://apiv4.dineoncampus.com/sites/public'
          head -40 sites.headers
          echo 'body bytes:' $(wc -c < sites.json)
          node - <<'NODE'
          const fs = require('fs');
          const raw = JSON.parse(fs.readFileSync('sites.json', 'utf8'));
          const sites = Array.isArray(raw) ? raw : Array.isArray(raw?.sites) ? raw.sites : [];
          const score = (site) => {
            const name = String(site?.name ?? '').toLowerCase();
            const slug = String(site?.slug ?? site?.short_name ?? site?.shortName ?? '').toLowerCase();
            if (slug === 'calpoly' || slug === 'cal-poly') return 100;
            if (name.includes('california polytechnic state university')) return 95;
            if (name.includes('cal poly') && (name.includes('san luis') || name.includes('slo'))) return 90;
            if (name === 'cal poly') return 80;
            return 0;
          };
          sites.sort((a,b) => score(b)-score(a));
          const winner = sites[0];
          console.log('sites count:', sites.length);
          console.log('best Cal Poly candidate:', JSON.stringify({id:winner?.id,name:winner?.name,slug:winner?.slug,score:score(winner)}));
          if (!winner?.id || score(winner) <= 0) process.exit(2);
          fs.writeFileSync('site-id.txt', String(winner.id));
          NODE
          site_id="$(cat site-id.txt)"
          echo "site_id=${site_id}"

          for url in \
            "https://apiv4.dineoncampus.com/locations/status_by_site?siteId=${site_id}" \
            "https://apiv4.dineoncampus.com/locations/weekly_schedule?site_id=${site_id}" \
            "https://apiv4.dineoncampus.com/locations/weekly_schedule?siteId=${site_id}"
          do
            echo "--- ${url} ---"
            code=$(curl -sS -D probe.headers -o probe.json -w '%{http_code}' \
              -H "Origin: ${origin}" \
              -H 'Accept: application/json, text/plain, */*' \
              -H 'Sec-Fetch-Mode: cors' \
              "$url")
            echo "status=${code} bytes=$(wc -c < probe.json)"
            grep -Ei '^(access-control|content-type|cache-control|vary):' probe.headers || true
            if [ "$code" = 200 ]; then
              node - <<'NODE'
              const fs = require('fs');
              const value = JSON.parse(fs.readFileSync('probe.json','utf8'));
              const describe = (v) => Array.isArray(v)
                ? {type:'array', length:v.length, firstKeys:v[0] && typeof v[0] === 'object' ? Object.keys(v[0]).slice(0,20) : []}
                : v && typeof v === 'object'
                  ? {type:'object', keys:Object.keys(v).slice(0,30), arrayChildren:Object.fromEntries(Object.entries(v).filter(([,x])=>Array.isArray(x)).map(([k,x])=>[k,x.length]))}
                  : {type:typeof v};
              console.log(JSON.stringify(describe(value)));
              const locs = Array.isArray(value) ? value : value?.theLocations ?? value?.locations ?? [];
              console.log('sample locations:', JSON.stringify(locs.slice(0,5).map(x => ({name:x?.name,slug:x?.slug,id:x?.id,is_building:x?.is_building,keys:x && typeof x==='object'?Object.keys(x).slice(0,20):[]})), null, 2));
              NODE
            else
              head -c 500 probe.json || true
              echo
            fi
          done
